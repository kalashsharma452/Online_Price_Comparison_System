version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-price_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - backend/.env
    environment:
      PORT: "5050"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-price_intelligence}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "5050:5050"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_API_BASE: http://localhost:5050
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pg_data:
